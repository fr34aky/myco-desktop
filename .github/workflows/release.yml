name: Release

# Build the Myco *desktop* app bundles and publish them to a GitHub Release on
# a version tag. This repo ships the desktop app only; the Android APK lives in
# the upstream project (github.com/Origami74/myco).
#
# Linux (.deb + AppImage) is built today. macOS (.dmg) and Windows (.msi) are a
# runner-matrix extension for later — each OS runs the same `cargo tauri build`;
# only the apt system-deps step is Linux-specific (see the commented matrix).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'   # e.g. v0.1.0

env:
  # `fips` is a gitignored path dep (reference/fips); a fresh checkout has none,
  # so clone the branch carrying the mobile/platform seams into place.
  FIPS_REPO: https://github.com/jmcorgan/fips.git
  FIPS_REF: fix/platform-ble

jobs:
  desktop:
    name: Desktop bundles
    runs-on: ubuntu-latest
    # To also ship macOS and Windows later, make this a matrix:
    #   strategy:
    #     matrix:
    #       os: [ubuntu-latest, macos-latest, windows-latest]
    #   runs-on: ${{ matrix.os }}
    # cargo tauri build produces .dmg on macOS and .msi on Windows with no
    # further change; only the "Install build deps" step is Linux-only (already
    # guarded on runner.os below).
    permissions:
      contents: write       # create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fips core
        run: git clone --depth 1 --branch "$FIPS_REF" "$FIPS_REPO" reference/fips

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        # bindgen (libclang) + the Tauri (wry/webkit2gtk) system libraries the
        # bundle links and the AppImage packages.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build bundles
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          # Copy whatever this OS produced (deb/appimage on Linux; dmg/msi/nsis
          # once the matrix is enabled). Missing globs are skipped, not an error.
          shopt -s nullglob
          for f in target/release/bundle/deb/*.deb \
                   target/release/bundle/appimage/*.AppImage \
                   target/release/bundle/dmg/*.dmg \
                   target/release/bundle/msi/*.msi \
                   target/release/bundle/nsis/*-setup.exe; do
            cp "$f" dist/
          done
          ls -lh dist/

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myco-desktop-${{ github.ref_name }}-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Myco Desktop ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
