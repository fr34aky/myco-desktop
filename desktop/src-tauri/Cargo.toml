[package]
name = "myco-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Myco desktop shell (Tauri): the Android app's feature set on Linux"

# A binary, not part of the cdylib story: links myco-core as a plain rlib —
# there is no FFI layer on desktop (docs/design/desktop.md).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
myco-core = { path = "../../myco-core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
